# Optional overlay: attach tsdashboard-web to the tscharts Compose network so
# it can call Django over plain HTTP as http://django:8000 (Compose service
# name). Do not use container_name django_app as a hostname — underscores are
# rejected by Django ALLOWED_HOSTS / HTTP Host rules.
#
# Prerequisites:
#   - tscharts stack already up from tscharts/docker/
#   - Discover the network name:
#       docker network ls | grep app-network
#     Often: docker_app-network  (project name = directory name "docker")
#
# Usage:
#   export TSCHARTS_COMPOSE_NETWORK=docker_app-network
#   # in .env also set:
#   #   TSCHARTS_BASE_URL=http://django:8000
#   #   TSCHARTS_TLS_INSECURE=0
#   docker compose -f docker-compose.yml -f docker-compose.tscharts-net.yml up -d --build

services:
  tsdashboard-web:
    networks:
      - default
      - tscharts

networks:
  tscharts:
    external: true
    name: ${TSCHARTS_COMPOSE_NETWORK:-docker_app-network}
